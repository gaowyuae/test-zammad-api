[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra --tb=short --basetemp=.tmp/pytest -m functional"
markers = [
    "unit: 不连接被测环境的基础能力检查，不计入业务 TC 覆盖",
    "functional: 功能接口用例",
    "pilot: P0 五条试点",
    "database: 需要独立只读数据库账号的功能用例",
    "performance: 仅显式执行的性能专项",
    "concurrency: 仅显式执行的并发专项",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".runtime", ".venv", ".downloads", ".tmp", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
